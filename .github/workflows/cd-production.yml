name: CD - Production Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Commit SHA / image tag validated in staging"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  deployments: write

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: drl-portfolio-inference
  ECS_CLUSTER: drl-portfolio-production
  ECS_SERVICE: inference-production
  CONTAINER_NAME: inference
  ECS_TASK_DEF: .aws/production-taskdef.json
  APPSPEC: .aws/appspec.yaml
  CODEDEPLOY_APP: drl-portfolio-inference-app
  CODEDEPLOY_GROUP: inference-bluegreen

jobs:
  resolve-image:
    name: Resolve Release Image Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

  production-release:
    name: Blue-Green Production Deploy
    runs-on: ubuntu-latest
    needs: resolve-image
    environment:
      name: production
      url: https://app.portfolio.example.com
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm image exists in ECR
        id: verify-image
        env:
          IMAGE_TAG: ${{ needs.resolve-image.outputs.image_tag }}
        run: |
          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}"
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "image=${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Render production task definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEF }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.verify-image.outputs.image }}

      - name: Blue-Green deploy via CodeDeploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          codedeploy-appspec: ${{ env.APPSPEC }}
          codedeploy-application: ${{ env.CODEDEPLOY_APP }}
          codedeploy-deployment-group: ${{ env.CODEDEPLOY_GROUP }}

      - name: Post-deploy production health check
        env:
          PROD_ENDPOINT: https://app.portfolio.example.com
          PROD_INFERENCE_API_KEY: ${{ secrets.PROD_INFERENCE_API_KEY }}
        run: |
          status=$(curl -sf -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${PROD_INFERENCE_API_KEY}" \
            "${PROD_ENDPOINT}/ready")
          test "$status" = "200"

      - name: Write immutable audit trail
        if: always()
        env:
          IMAGE_TAG: ${{ needs.resolve-image.outputs.image_tag }}
        run: |
          cat > audit-log.json <<EOF
          {
            "release": "${{ github.event.release.tag_name || github.event.inputs.image_tag }}",
            "image_tag": "${IMAGE_TAG}",
            "deployed_image": "${{ steps.verify-image.outputs.image }}",
            "actor": "${{ github.actor }}",
            "approved_environment": "production",
            "run_id": "${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "deployment_status": "${{ job.status }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat audit-log.json

      - name: Upload audit trail artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-audit-log-${{ github.run_id }}
          path: audit-log.json
          retention-days: 365
